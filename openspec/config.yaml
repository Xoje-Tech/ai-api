schema: spec-driven

# ai-api — Spec-Driven Development configuration
# Generated by sdd-init on 2026-06-30.
# This file is the source of truth for SDD behaviour in this project.

project: ai-api
artifactStore: openspec

# Hard TDD is active for this project (declared in AGENTS.md → "Strict TDD mode
# is active (write test first, watch it fail, write code, watch it pass)").
strict_tdd: true

testing:
  runner: vitest
  runner_version: 4.1.9
  environment: node
  config_path: vitest.config.ts
  include:
    - src/**/*.{test,spec}.ts
    - scripts/**/*.{test,spec}.ts
  coverage_provider: "@vitest/coverage-v8"
  coverage_targets:
    statements: 80
    branches: 70
  mode: co-located
  test_command: "pnpm test:run"
  watch_command: "pnpm test"
  coverage_command: "pnpm test:coverage"
  as_of: 2026-06-30
  # Custom doc-source used by sdd-tasks / sdd-apply to discover context beyond
  # the source tree. ai-api ships an OKF bundle, declared by AGENTS.md.
  doc_sources:
    - kind: okf-bundle
      path: .knowledge/
      index: .knowledge/index.md
      auto_generated:
        - .knowledge/adapters/*.md
        - .knowledge/api/endpoints.md
        - .knowledge/env/variables.md
      hand_written:
        - .knowledge/architecture/*.md
        - .knowledge/index.md
      regenerator: scripts/regenerate-knowledge.ts
      linter: scripts/lint-knowledge-bundle.ts

context: |
  Tech stack:
    - Runtime: Node 26 (>=26.0.0, declared in package.json `engines` and
      confirmed by .tool-versions).
    - Package manager: pnpm 11.9 (`packageManager: "pnpm@11.9.0"`).
    - Language: TypeScript 5.x with `strict: true`, ESM modules, `.js`
      extensions on all imports, and path aliases (`@/`, `@ai-balancer/*`,
      `@users/*`, `@shared/*`).
    - HTTP framework: Hono 4.12 wired with `@hono/node-server` for Node.
    - Validation: Zod 4.
    - Logging: Pino 10 (JSON to stdout; `LOG_PRETTY=1` switches to
      pino-pretty for local dev).
    - Database: Postgres via the `postgres` driver (pg); InMemory fallback
      for `/users` when `DATABASE_URL` is unset.
    - SDKs: `groq-sdk` 0.37, `@openrouter/sdk` 0.9 (both adapters implement
      the `AIService` port in the `ai-balancer` module).
  Architecture:
    - Hexagonal + Screaming under `src/modules/{domain}/{application,domain,
      infrastructure,interface}/`.
    - Three modules currently: `ai-balancer` (core domain — round-robin
      balancer + circuit-breaker failover), `users` (Postgres-backed CRUD),
      and `shared` (HTTP helpers, logger, landing page).
    - Entry: `src/index.ts` (bootstrap) + `src/app.ts` (Hono factory
      `buildApp({ services, balancer, userRepository })`).
    - Routes (detected in src/app.ts): `GET /` (landing HTML),
      `GET /health`, `POST /chat` (SSE streaming via round-robin),
      `GET /v1/models`, `POST /v1/chat/completions`, `* /users/*`
      (delegated to the `users` module).
  Testing:
    - Vitest 4.1.9 with the `node` environment. Coverage via
      `@vitest/coverage-v8`. Tests are co-located next to source as
      `<file>.test.ts`. 11 test files / 70 tests currently passing in <500ms.
    - AGENTS.md declares strict TDD: every change must be RED → GREEN →
      REFACTOR, and the regenerator + knowledge linter each ship with their
      own unit tests under `scripts/`.
  Style:
    - Strict TS, no `any` without justification.
    - Path aliases instead of `../../..` traversal.
    - Conventional commits, no AI attribution (per user preference).
    - Default branch: `master`.
  Tooling:
    - `pnpm dev` / `pnpm start` for runtime.
    - `pnpm test:run` for CI smoke, `pnpm test:coverage` for v8 coverage.
    - `pnpm typecheck` runs `tsc --noEmit`.
    - `pnpm knowledge:regen` / `pnpm knowledge:lint` maintain the OKF
      bundle; husky `pre-commit` runs `lint-staged`, which regenerates the
      matching bundle section when adapters/routes/env files are staged.

rules:
  proposal:
    - Include rollback plan for risky changes (DB migrations, breaker
      threshold changes, new SDK introduction).
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Reference the affected OKF concept pages in `.knowledge/` when a
      change touches an adapter, route, or env var.
  design:
    - Include sequence diagrams for complex flows (SSE failover, circuit
      breaker state transitions).
    - Document architecture decisions with rationale.
    - When the change introduces or modifies an adapter, ensure the
      `parseAdapterSource` regex set in `scripts/regenerate-knowledge.ts`
      still recognises the factory and service-name patterns, otherwise
      the regenerated `.knowledge/adapters/<name>.md` will lose context.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    tdd: true
    test_command: "pnpm test:run"
    guidelines:
      - Follow existing code patterns (hexagonal, strict TS, aliases).
      - RED-GREEN-REFACTOR (strict TDD active — see `strict_tdd: true`).
  verify:
    test_command: "pnpm test:run"
    typecheck_command: "pnpm typecheck"
    coverage_command: "pnpm test:coverage"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas.
    - When archiving, leave hand-written `.knowledge/architecture/*.md`
      pages untouched; they are sacred and never auto-overwritten.