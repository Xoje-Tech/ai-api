services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-api:local
    container_name: ai-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      AI_API_HOST: 0.0.0.0
      AI_API_ALLOW_PUBLIC: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s