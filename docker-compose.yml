services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-api:local
    container_name: ai-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:6789:6789"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 6789
      AI_API_HOST: 0.0.0.0
      AI_API_ALLOW_PUBLIC: "true"
      AI_API_KEY: ${AI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6789/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s